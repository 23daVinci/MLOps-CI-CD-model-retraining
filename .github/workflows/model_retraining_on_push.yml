name: Model Retraining on Push to Main - Github Lab 2

on:
  push:
    branches:
      - main  # Trigger the workflow on pushes to the main branch

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Generate and Store Timestamp
      id: timestamp
      run: |
        timestamp=$(date '+%Y%m%d%H%M%S')
        echo "$timestamp" > timestamp.txt
        echo "timestamp=$timestamp" >> $GITHUB_ENV

    - name: Check File Permissions
      run: ls -l src/train_model.py

    - name: Set File Permissions
      run: chmod +x src/train_model.py

    - name: Retrain Model
      run: |
        python src/train_model.py --timestamp "$timestamp"

    - name: Evaluate Model and Log Metrics
      run: |
        python src/evaluate_model.py --timestamp "$timestamp"
        metrics_filename="${timestamp}_metrics.json"
        mkdir -p metrics
        mv "$metrics_filename" "metrics/$metrics_filename"

    - name: Store and Version the New Model
      run: |
        model_filename="model_${timestamp}_dt_model.joblib"
        mkdir -p models
        mv "$model_filename" "models/$model_filename"

    - name: Commit and Push Changes
      run: |
        git config --global user.email "31367508+23daVinci@users.noreply.github.com"
        git config --global user.name "23daVinci"
        metrics_filename="metrics/${timestamp}_metrics.json"
        model_filename="models/model_${timestamp}_dt_model.joblib"
        git add -f "$metrics_filename" "$model_filename"
        # Commit only if there are changes
        if ! git diff --cached --quiet; then
          git commit -m "Add metrics and updated model for $timestamp"
          git push
        else
          echo "No changes to commit."
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
